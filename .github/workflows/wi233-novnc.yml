name: Win2025 Tailscale noVNC网页桌面
on:
  workflow_dispatch
jobs:
  novnc-host:
    runs-on: windows-2025
    timeout-minutes: 350
    steps:
      - name: 系统基础配置
        run: |
          $securePwd = ConvertTo-SecureString "Win@202566" -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $securePwd
          New-NetFirewallRule -DisplayName "AllowVNC" -Direction Inbound -LocalPort 5900 -Protocol TCP -Action Allow
          New-NetFirewallRule -DisplayName "AllowNoVNC" -Direction Inbound -LocalPort 6080 -Protocol TCP -Action Allow

      - name: 安装Tailscale
        run: winget install Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements

      - name: 接入Tailscale网络
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey $env:TS_AUTHKEY
          Start-Sleep 15

      - name: 下载压缩版TigerVNC（便携绿色版，无需安装）
        run: |
          $url = "https://github.com/TigerVNC/tigervnc/releases/download/v1.13.0/tigervnc-1.13.0-x64.zip"
          $zipPath = "$env:TEMP\tigervnc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath C:\TigerVNC -Force
          Start-Sleep 5

      - name: 配置VNC密码并启动服务
        run: |
          $vncPath = "C:\TigerVNC\winvnc.exe"
          if(Test-Path $vncPath){
            & $vncPath -register
            echo "123456" | & "C:\TigerVNC\vncpasswd.exe" -service
            Start-Process $vncPath
          } else {
            Write-Error "绿色版TigerVNC解压失败"
            exit 1
          }

      - name: 下载noVNC
        run: |
          git clone https://github.com/novnc/noVNC C:\noVNC
          Start-Sleep 3

      - name: 启动noVNC代理（转发至VNC 5900）
        run: |
          cd C:\noVNC
          Start-Process .\utils\websockify.exe 6080 localhost:5900

      - name: 常驻保持虚拟机运行
        run: |
          while($true) {
            Start-Sleep 60
          }
