name: Win2022 RDP 公网Cloudflared隧道
on:
  workflow_dispatch
jobs:
  rdp-host:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: 开启RDP远程桌面
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Restart-Service TermService -Force
          $securePwd = ConvertTo-SecureString "Win@202566" -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $securePwd
          New-NetFirewallRule -DisplayName "AllowRDP3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow

      - name: 安装 Tailscale（自用内网备用通道）
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"
          $dlUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $dlUrl -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

      - name: 启动Tailscale组网
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey $env:TS_AUTHKEY
          Start-Sleep 15

      - name: 启动Cloudflared TCP隧道转发RDP
        run: |
          $cfPath = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfPath -UseBasicParsing
          Start-Process $cfPath -ArgumentList "tunnel --no-autoupdate tcp://127.0.0.1:3389"

      - name: 持续保活实例
        run: |
          while($true){
            Start-Sleep 60
          }
