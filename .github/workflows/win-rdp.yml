name: Win2025 frp RDP
on:
  workflow_dispatch
jobs:
  rdp-host:
    runs-on: windows-2025
    timeout-minutes: 350
    steps:
      - name: 开启RDP + 设置runneradmin密码
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Restart-Service TermService -Force
          $securePwd = ConvertTo-SecureString "Win@202566" -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $securePwd

      - name: 放行3389防火墙
        run: |
          New-NetFirewallRule -DisplayName "RDP-TCP-3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow

      - name: 下载frp原版客户端（Github，海外可访问）
        run: |
          $dlPath = "C:\Users\runneradmin\Downloads\frp.zip"
          Invoke-WebRequest -Uri "https://github.com/fatedier/frp/releases/download/v0.51.2/frp_0.51.2_windows_386.zip" -OutFile $dlPath

      - name: 解压frp
        run: |
          $zipFile = "C:\Users\runneradmin\Downloads\frp.zip"
          $extractDir = "C:\Users\runneradmin\Downloads\"
          Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force

      - name: 生成frpc.ini
        run: |
          echo "[common]" > "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "server_addr = 47.109.152.106" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "server_port = 7000" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "tls_enable = false" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "user = qxCHUlNnkWPhLcQ9pXYuIDiH" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "token = ChmlFrpToken" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "[qii460qp]" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "type = tcp" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "local_ip = 127.0.0.1" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "local_port = 3389" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"
          echo "remote_port = 36713" >> "C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386\frpc.ini"

      - name: 修改RDP注册表关闭NLA
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v SecurityLayer /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v UserAuthentication /t REG_DWORD /d 0 /f

      - name: 启动frpc常驻
        run: |
          cd C:\Users\runneradmin\Downloads\frp_0.51.2_windows_386
          .\frpc.exe
          while($true){Start-Sleep 600}
