name: Win2025 noVNC网页远程桌面
on:
  workflow_dispatch
jobs:
  novnc-host:
    runs-on: windows-2025
    timeout-minutes: 340
    steps:
      # 1. 创建远程账号，规避重复加入管理员报错
      - name: 创建远程账号
        run: |
          $securePwd = ConvertTo-SecureString "Win@202566" -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $securePwd
          $member = Get-LocalGroupMember -Group Administrators -Member runneradmin -ErrorAction SilentlyContinue
          if(-not $member){
              Add-LocalGroupMember -Group Administrators -Member runneradmin
          }

      # 2. 防火墙放行端口
      - name: 放行防火墙端口
        run: |
          New-NetFirewallRule -DisplayName "VNC-5900" -Direction Inbound -LocalPort 5900 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "noVNC-9000" -Direction Inbound -LocalPort 9000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue

      # 3. 静默安装Tailscale
      - name: 安装Tailscale
        run: |
          winget install Tailscale.Tailscale --silent --accept-source-agreements
          Start-Process "C:\Program Files\Tailscale\tailscale.exe" -ArgumentList "up --authkey ${{ secrets.TAILSCALE_AUTHKEY }}" -Wait

      # 4. TigerVNC安装 + 正确调用程序 + 正确注册表路径
      - name: 安装TigerVNC
        run: |
          winget install TigerVNC.TigerVNC --silent --accept-source-agreements
          Start-Process -FilePath "C:\Program Files\TigerVNC\winvnc4.exe" -ArgumentList "-register" -Wait
          Set-ItemProperty -Path "HKLM:\Software\TigerVNC\WinVNC4" -Name Password -Value ("password123" | ConvertTo-SecureString -AsPlainText -Force)
          Start-Service WinVNC4 -ErrorAction SilentlyContinue

      # 5. 安装Node.js LTS
      - name: 安装NodeJS
        run: winget install OpenJS.NodeJS.LTS --silent

      # 6. 拉取noVNC与websockify
      - name: 拉取noVNC
        run: |
          git clone https://github.com/novnc/noVNC.git C:\noVNC
          cd C:\noVNC
          git clone https://github.com/novnc/websockify.git websockify

      # 7. 后台启动websockify代理
      - name: 启动noVNC服务
        run: |
          cd C:\noVNC
          Start-Process node -ArgumentList "websockify/websockify.js --web . 9000 localhost:5900"

      # 可选：开启外网访问，Tailscale后台提前配置Funnel权限
      # - name: 开放公网Funnel
      #   run: tailscale funnel 9000

      # 8. 持续循环，防止虚拟机销毁
      - name: 保持运行
        run: |
          while($true){
            Start-Sleep -Seconds 60
          }
